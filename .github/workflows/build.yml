name: Build lecture notes

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-lecture-notes-${{ github.ref }}
  cancel-in-progress: false

env:
  TECTONIC_VERSION: '0.17.0'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Tectonic
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%40${TECTONIC_VERSION}/tectonic-${TECTONIC_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | sudo tar -xz -C /usr/local/bin tectonic
          tectonic --version

      - name: Cache Tectonic bundle
        uses: actions/cache@v4
        with:
          path: ~/.cache/Tectonic
          key: tectonic-${{ runner.os }}-${{ env.TECTONIC_VERSION }}

      - name: Build lecture notes
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct -- '*.tex' '*.sty' '*.cls' '*.bib' logo.pdf)"
          mkdir -p build
          tectonic --outdir build main.tex
          test -s build/main.pdf

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: lecture-notes
          path: build/main.pdf
          if-no-files-found: error

      - name: Commit updated PDF to main
        if: github.ref == 'refs/heads/main'
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo "A newer commit is on main. Its workflow will update the PDF."
            exit 0
          fi

          cp build/main.pdf main.pdf
          git add -- main.pdf
          if git diff --cached --quiet; then
            echo "The PDF is up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Auto-build lecture notes PDF"
          git push origin HEAD:main
